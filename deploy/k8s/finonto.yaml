# FinOnto · Kubernetes 单副本部署
#   kubectl apply -f deploy/k8s/finonto.yaml
#
# 关键点
# * strategy: Recreate —— SQLite 单写者，两个 Pod 同时写会锁库
# * PVC(RWO) 挂 /app/server/var —— 数据、对象存储、组件选择都在这里
# * /api/health 同时作 readiness 与 liveness 探针
# * 要水平扩展：改用外部 Postgres + 对象存储，并把副本数保持 1（或换只读副本架构）
apiVersion: v1
kind: Namespace
metadata:
  name: finonto
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: finonto-data
  namespace: finonto
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finonto
  namespace: finonto
  labels:
    app: finonto
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: finonto
  template:
    metadata:
      labels:
        app: finonto
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: finonto
          image: finonto:0.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: FINONTO_ENV
              value: prod
            - name: FINONTO_DATA_DIR
              value: /app/server/var
            - name: FINONTO_AUTO_BOOTSTRAP
              value: "true"
            - name: FINONTO_AUTH_ENABLED
              value: "true"
            - name: FINONTO_SANDBOX_ENABLED
              value: "true"
            - name: FINONTO_COOKIE_SECURE
              value: "true"
            # 初始管理员密码与真实模型密钥一律用 Secret 注入，不要写进 yaml
            - name: FINONTO_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: finonto-secrets
                  key: admin-password
            # - name: FINONTO_LLM_API_KEY
            #   valueFrom:
            #     secretKeyRef: { name: finonto-secrets, key: llm-api-key }
          # 上线前先跑自检：kubectl exec deploy/finonto -- python scripts/preflight.py
          volumeMounts:
            - name: data
              mountPath: /app/server/var
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: finonto-data
---
apiVersion: v1
kind: Service
metadata:
  name: finonto
  namespace: finonto
spec:
  selector:
    app: finonto
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: finonto
  namespace: finonto
  annotations:
    # SSE 必须关闭缓冲，否则逐 token 会变成一次性下发
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
spec:
  rules:
    - host: finonto.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: finonto
                port:
                  number: 80

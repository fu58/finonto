# FinOnto · Nginx 反向代理示例
#
# 用法：把 upstream 指向实际地址，站点根路径转发到 FinOnto。
# 唯一的坑是 SSE：必须关闭 proxy_buffering，否则流式回答会被攒成一次性输出。

upstream finonto_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name finonto.internal;

    client_max_body_size 32m;   # 与 FINONTO_MAX_UPLOAD_MB 对齐

    # 流式接口：关闭缓冲、拉长超时
    location /api/rag/stream {
        proxy_pass http://finonto_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    location /api/agent/stream {
        proxy_pass http://finonto_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    location / {
        proxy_pass http://finonto_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 静态资源可交给 Nginx 直接出，减少 Python 进程负担
    location /static/ {
        proxy_pass http://finonto_backend;
        proxy_set_header Host $host;
        expires 7d;
    }
}
